schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - "Keep the proposal short and in plain English: state problem, intent, high-level scope, and affected capabilities."
    - "Do not include architectural diagrams, class/method names, package rules, or step-by-step implementation details (those belong in design and tasks)."
  design:
    - "Start with a high-level design (HLD) overview, followed by distinct architectural decisions with rationale and considered alternatives, and a brief verification strategy."
    - "Focus on enduring principles, boundaries, and trade-offs; do not duplicate task checklists or file-by-file edit instructions."
  tasks:
    - "Make tasks self-contained and actionable so an implementor can execute the change using only tasks.md and design.md without prior conversation context."
    - "Put concrete file paths, class/method changes, and targeted verification commands here rather than in proposal.md or design.md."

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
