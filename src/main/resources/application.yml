spring:
  application:
    name: gravifon
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:${gravifon.config-dir}/gravifon;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: db,musicLibrary
        liveness:
          include: livenessState

gravifon:
  library:
    dir: /music
    startup-scan-enabled: true
  config-dir: /config
  stream:
    refresh-ahead: 1h
    refresh-cron: "0 */10 * * * *"
    refresh-upcoming-count: 10
    refresh-min-validity: 1m
    refresh-timeout: 5s
    refresh-max-attempts: 2
    proxy-connect-timeout: 5s
    proxy-read-timeout: 15s
  session:
    inactivity-timeout: 24h
    cleanup-cron: "0 0 * * * *"
