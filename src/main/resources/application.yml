spring:
  application:
    name: gravifon
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:${gravifon.config-dir}/gravifon;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: db,musicLibrary
        liveness:
          include: livenessState

gravifon:
  library:
    music-root: ${GRAVIFON_LIBRARY_DIR:/music}
    startup-scan-enabled: ${GRAVIFON_STARTUP_SCAN_ENABLED:true}
  config-dir: ${GRAVIFON_CONFIG_DIR:/config}
  streams:
    refresh-ahead: ${GRAVIFON_STREAM_REFRESH_AHEAD:1h}
    refresh-cron: ${GRAVIFON_STREAM_REFRESH_CRON:0 */10 * * * *}
    refresh-upcoming-count: ${GRAVIFON_STREAM_REFRESH_UPCOMING_COUNT:10}
    refresh-min-validity: ${GRAVIFON_STREAM_REFRESH_MIN_VALIDITY:1m}
    refresh-timeout: ${GRAVIFON_STREAM_REFRESH_TIMEOUT:5s}
    refresh-max-attempts: ${GRAVIFON_STREAM_REFRESH_MAX_ATTEMPTS:2}
    proxy-connect-timeout: ${GRAVIFON_STREAM_PROXY_CONNECT_TIMEOUT:5s}
    proxy-read-timeout: ${GRAVIFON_STREAM_PROXY_READ_TIMEOUT:15s}
