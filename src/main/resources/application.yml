spring:
  application:
    name: gravifon
  datasource:
    url: jdbc:h2:file:${gravifon.config-dir}/gravifon;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

logging:
  structured:
    format:
      console: logstash

gravifon:
  music-root: ${GRAVIFON_LIBRARY_DIR:/music}
  config-dir: ${GRAVIFON_CONFIG_DIR:/config}
  startup-scan-enabled: ${GRAVIFON_STARTUP_SCAN_ENABLED:true}
  streams:
    refresh-enabled: ${GRAVIFON_STREAM_REFRESH_ENABLED:true}
    refresh-ahead: ${GRAVIFON_STREAM_REFRESH_AHEAD:PT1H}
    refresh-interval: ${GRAVIFON_STREAM_REFRESH_INTERVAL:PT10M}
    refresh-scope: ${GRAVIFON_STREAM_REFRESH_SCOPE:ACTIVE_PLAYLIST_PLUS_NEXT}
    refresh-timeout: ${GRAVIFON_STREAM_REFRESH_TIMEOUT:PT5S}
    refresh-max-attempts: ${GRAVIFON_STREAM_REFRESH_MAX_ATTEMPTS:2}

