<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravifon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface2: #eef3ff;
      --accent: #3b82f6;
      --accent2: #6366f1;
      --text: #0f172a;
      --text-muted: #64748b;
      --active: #3b82f6;
      --border: #d7e0ef;
      --btn-bg: #f1f5ff;
      --btn-hover: #dbe8ff;
      --radius: 8px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--surface2);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 { font-size: 1.4rem; letter-spacing: 2px; color: var(--accent); }
    header .subtitle { font-size: 0.75rem; color: var(--text-muted); }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ────────────────────────────────────── */
    aside {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    aside h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      padding: 14px 16px 8px;
    }

    #playlist-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    #playlist-list li {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 0.88rem;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    #playlist-list li:hover { background: var(--btn-bg); }
    #playlist-list li.active {
      border-left-color: var(--accent);
      color: var(--accent);
      background: rgba(233,69,96,0.08);
    }

    /* ── Main ───────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 20px;
      gap: 16px;
    }

    /* Now-playing */
    .now-playing {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px 20px;
      border: 1px solid var(--border);
    }

    .now-playing .label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    #track-name {
      font-size: 1.05rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    #track-meta { font-size: 0.8rem; color: var(--text-muted); }

    .position-row {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Controls */
    .controls-panel {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px 20px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transport {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .mode-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .seek-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    #seek-slider {
      width: 100%;
      accent-color: var(--accent);
    }

    #seek-preview {
      color: var(--text-muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      min-width: 42px;
      text-align: right;
    }

    .mode-row span {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-right: 4px;
    }

    button {
      background: var(--btn-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s, transform 0.1s;
    }

    button:hover { background: var(--btn-hover); border-color: var(--btn-hover); }
    button:active { transform: scale(0.96); }
    button.mode-btn.active { background: var(--accent2); border-color: var(--accent2); }
    button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }

    /* Track list */
    .track-list-panel {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .track-list-panel h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      padding: 12px 16px 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #track-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    #track-list li {
      padding: 8px 16px;
      font-size: 0.82rem;
      display: flex;
      gap: 10px;
      border-left: 3px solid transparent;
      cursor: default;
    }

    #track-list li.active {
      border-left-color: var(--accent);
      color: var(--accent);
      background: rgba(233,69,96,0.06);
    }

    #track-list li .track-num { color: var(--text-muted); min-width: 26px; }
    #track-list li .track-fname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #track-list li .track-dur { color: var(--text-muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }

    /* Footer */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 20px;
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      gap: 24px;
      flex-shrink: 0;
    }

    footer code { color: var(--accent2); font-size: 0.7rem; }

    #transport-status { color: var(--text-muted); }
    #transport-status.playing { color: #4caf50; }
    #transport-status.paused  { color: #ff9800; }
    #transport-status.stopped { color: var(--text-muted); }
  </style>
</head>
<body>

<header>
  <h1>GRAVIFON</h1>
  <span class="subtitle">Local-network audio player</span>
</header>

<div class="layout">
  <aside>
    <h2>Playlists</h2>
    <ul id="playlist-list"></ul>
  </aside>

  <main>
    <div class="now-playing">
      <div class="label">Now Playing</div>
      <div id="track-name">—</div>
      <div id="track-meta"></div>
      <div class="position-row">
        <span id="position-display">0:00</span><span id="duration-display"></span>
        &nbsp;·&nbsp; <span id="transport-status" class="stopped">Stopped</span>
      </div>
    </div>

    <div class="controls-panel">
      <div class="transport">
        <button id="btn-play"  class="primary" title="Play">▶ Play</button>
        <button id="btn-pause" title="Pause">⏸ Pause</button>
        <button id="btn-stop"  title="Stop">⏹ Stop</button>
        <button id="btn-next"  title="Next track">⏭ Next</button>
      </div>
      <div class="seek-row">
        <input id="seek-slider" type="range" min="0" max="0" step="1" value="0" disabled>
        <span id="seek-preview">0:00</span>
      </div>
      <div class="mode-row">
        <span>Mode:</span>
        <button id="btn-sequential" class="mode-btn active">Sequential</button>
        <button id="btn-random"     class="mode-btn">Random</button>
      </div>
    </div>

    <div class="track-list-panel">
      <h3>Tracks in playlist</h3>
      <ul id="track-list"></ul>
    </div>
  </main>
</div>

<footer>
  <span>Correlation: <code id="cid-display">—</code></span>
  <span id="poll-status">Connecting…</span>
</footer>

<!-- Hidden audio element — actual playback engine -->
<audio id="audio-player" preload="none"></audio>

<script>
'use strict';

// ── Log-level severity convention ────────────────────────────────────────────
// trace  – high-detail troubleshooting (hot-path diagnostics, repeated events)
// debug  – diagnostic information useful during development or investigation
// info   – key lifecycle events (track started, playlist selected, app ready)
// warn   – recoverable / unexpected conditions (stall, buffering delay, missing CID)
// error  – actual failures (audio decode error, API failure, unrecoverable state)

const LOG_LEVELS = { trace: 0, debug: 1, info: 2, warn: 3, error: 4 };
const MIN_LEVEL  = LOG_LEVELS['debug'];

function makeLogger(component) {
  function emit(level, message, extra = {}) {
    if (LOG_LEVELS[level] < MIN_LEVEL) return;
    const entry = {
      ts: new Date().toISOString(),
      level,
      component,
      correlationId: lifecycle.id,
      message,
      ...extra
    };
    const fn = level === 'error' ? console.error
             : level === 'warn'  ? console.warn
             : level === 'trace' ? console.debug
             : console.log;
    fn(`[${level.toUpperCase()}][${(lifecycle.id || '').slice(0, 8)}] ${component}: ${message}`, extra);
  }
  return {
    trace: (m, x) => emit('trace', m, x),
    debug: (m, x) => emit('debug', m, x),
    info:  (m, x) => emit('info',  m, x),
    warn:  (m, x) => emit('warn',  m, x),
    error: (m, x) => emit('error', m, x),
  };
}

const appLog   = makeLogger('App');
const apiLog   = makeLogger('Api');
const audioLog = makeLogger('Audio');
const uiLog    = makeLogger('UI');

// ── Correlation lifecycle manager ────────────────────────────────────────────
// One correlation id per active operation scope:
//   • track playback (from load through ended/stop)
//   • playlist switch
//   • playback mode change
// A new id is minted on each scope boundary.
const lifecycle = {
  id: crypto.randomUUID(),

  startNew(reason) {
    const prev = this.id;
    this.id = crypto.randomUUID();
    document.getElementById('cid-display').textContent = this.id;
    appLog.debug('Correlation lifecycle boundary', { reason, previousId: prev });
    return this.id;
  }
};
document.getElementById('cid-display').textContent = lifecycle.id;

// ── API client ───────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const cid = lifecycle.id;
  apiLog.debug(`→ ${method} ${path}`, { correlationId: cid });
  try {
    const opts = {
      method,
      headers: { 'CorrelationId': cid, 'Content-Type': 'application/json' }
    };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(path, opts);

    if (!res.ok) {
      const text = await res.text().catch(() => '');
      apiLog.error(`${method} ${path} → ${res.status}`, { correlationId: cid, status: res.status, body: text });
      return null;
    }

    apiLog.debug(`← ${method} ${path} ${res.status}`, { correlationId: cid });
    return res.headers.get('content-type')?.includes('application/json')
        ? res.json()
        : null;
  } catch (err) {
    apiLog.error(`${method} ${path} network error`, { correlationId: cid, error: err.message });
    return null;
  }
}

// ── HTML Audio element and diagnostic event logging ──────────────────────────
// Severity by event criticality (per log-level convention above):
//   info  : loadedmetadata, play, pause, ended          — key lifecycle events
//   debug : loadstart, canplay, seeking, seeked          — diagnostics
//   warn  : waiting, stalled                             — recoverable issues
//   error : error                                        — actual failure

const AUDIO_EVENT_SEVERITY = {
  loadstart:      'debug',
  loadedmetadata: 'info',
  canplay:        'debug',
  play:           'info',
  pause:          'info',
  seeking:        'debug',
  seeked:         'debug',
  waiting:        'warn',
  stalled:        'warn',
  ended:          'info',
  error:          'error'
};

const audioEl = document.getElementById('audio-player');
let currentAudioTrackId = null;
let isSeekSliderActive = false;
let pendingSeekTargetSeconds = null;
let localPlayRequested = false;

Object.entries(AUDIO_EVENT_SEVERITY).forEach(([event, level]) => {
  audioEl.addEventListener(event, () => {
    const ctx = {
      event,
      trackId: currentAudioTrackId,
      currentTime: audioEl.currentTime,
      readyState: audioEl.readyState,
      paused: audioEl.paused
    };
    if (event === 'error') {
      const err = audioEl.error;
      audioLog.error(`Audio error — code ${err?.code}: ${err?.message ?? 'unknown'}`, { ...ctx, errorCode: err?.code });
    } else {
      audioLog[level](`Audio: ${event}`, ctx);
      // Lifecycle boundary: track ended → next play is a new lifecycle
      if (event === 'ended') {
        lifecycle.startNew('track-ended');
      }
    }
  });
});

// ── State and catalog cache ──────────────────────────────────────────────────
let trackCatalog = {};   // id → track
let lastState    = null;

function fmtDur(sec) {
  if (sec == null) return '?';
  return `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
}

function localTransportState() {
  if (!lastState?.currentTrackId) return 'stopped';
  if (!audioEl.paused) return 'playing';
  return audioEl.currentTime > 0.05 ? 'paused' : 'stopped';
}

function renderTransportStatus() {
  const state = localTransportState();
  const statusEl = document.getElementById('transport-status');
  statusEl.textContent = state.charAt(0).toUpperCase() + state.slice(1);
  statusEl.className = state;
}

function updatePositionFromAudio() {
  if (!lastState?.currentTrackId || currentAudioTrackId !== lastState.currentTrackId) {
    return;
  }

  const position = Math.floor(Number(audioEl.currentTime || 0));
  document.getElementById('position-display').textContent = fmtDur(position);

  const seekSlider = document.getElementById('seek-slider');
  if (!isSeekSliderActive) {
    seekSlider.value = String(Math.max(0, Math.floor(audioEl.currentTime || 0)));
    document.getElementById('seek-preview').textContent = fmtDur(Number(seekSlider.value));
  }
}

// ── Audio sync ───────────────────────────────────────────────────────────────
function syncAudio(state) {
  if (!state?.currentTrackId) {
    if (!audioEl.paused) { audioEl.pause(); }
    audioEl.removeAttribute('src');
    currentAudioTrackId = null;
    renderTransportStatus();
    return;
  }

  if (state.currentTrackId !== currentAudioTrackId) {
    currentAudioTrackId = state.currentTrackId;
    const streamUrl = new URL(`/api/stream/${state.currentTrackId}`, window.location.origin);
    // Audio element requests cannot set custom headers; include lifecycle correlation in query.
    streamUrl.searchParams.set('cid', lifecycle.id);
    streamUrl.searchParams.set('CorrelationId', lifecycle.id);
    audioEl.src = streamUrl.toString();
    audioLog.info('Audio source changed', { trackId: state.currentTrackId });

    if (localPlayRequested) {
      audioEl.play().catch(err =>
        audioLog.error('audio.play() rejected after source swap', { error: err.message }));
    }
  }

  if (!isSeekSliderActive && Number.isFinite(state.positionSeconds)) {
    const serverPosition = Number(state.positionSeconds);
    if (audioEl.paused || pendingSeekTargetSeconds != null) {
      const driftSeconds = Math.abs(audioEl.currentTime - serverPosition);
      if (driftSeconds > 0.15) {
        audioEl.currentTime = serverPosition;
      }
    }

    if (pendingSeekTargetSeconds != null && Math.abs(serverPosition - pendingSeekTargetSeconds) <= 1) {
      pendingSeekTargetSeconds = null;
    }
  }

  renderTransportStatus();
  updatePositionFromAudio();
}

// ── UI render ────────────────────────────────────────────────────────────────
function render(state, playlists) {
  if (!state) return;

  const track = state.currentTrackId ? trackCatalog[state.currentTrackId] : null;

  document.getElementById('track-name').textContent =
      track ? track.filename : '—';
  document.getElementById('track-meta').textContent =
      track ? `${track.format.toUpperCase()}  ·  ${fmtDur(track.durationSeconds)}` : '';
  const localPositionSeconds =
      currentAudioTrackId === state.currentTrackId && Number.isFinite(audioEl.currentTime)
        ? Math.floor(audioEl.currentTime)
        : Number(state.positionSeconds ?? 0);

  document.getElementById('position-display').textContent = fmtDur(localPositionSeconds);
  document.getElementById('duration-display').textContent =
      track?.durationSeconds ? ` / ${fmtDur(track.durationSeconds)}` : '';

  const seekSlider = document.getElementById('seek-slider');
  const seekPreview = document.getElementById('seek-preview');
  const maxSeek = Number(track?.durationSeconds ?? 0);
  const currentSeek = Math.max(0, Math.min(localPositionSeconds, maxSeek));

  seekSlider.disabled = !track;
  seekSlider.max = String(maxSeek);
  if (!isSeekSliderActive) {
    seekSlider.value = String(currentSeek);
  }
  seekPreview.textContent = fmtDur(Number(seekSlider.value));

  renderTransportStatus();

  // Mode buttons
  document.getElementById('btn-sequential').classList.toggle('active', state.playbackMode === 'sequential');
  document.getElementById('btn-random').classList.toggle('active', state.playbackMode === 'random');

  // Playlist list
  const pListEl = document.getElementById('playlist-list');
  pListEl.innerHTML = (playlists ?? []).map(p =>
    `<li class="${p.id === state.activePlaylistId ? 'active' : ''}" data-id="${p.id}">
      <span>${p.name}</span>
      <span style="float:right;font-size:0.75rem;color:var(--text-muted)">${p.trackIds.length}</span>
    </li>`
  ).join('');

  // Track list for active playlist
  const activePl = (playlists ?? []).find(p => p.id === state.activePlaylistId);
  const tListEl  = document.getElementById('track-list');
  tListEl.innerHTML = (activePl?.trackIds ?? []).map((id, i) => {
    const t = trackCatalog[id];
    return `<li class="${id === state.currentTrackId ? 'active' : ''}">
      <span class="track-num">${String(i + 1).padStart(2, ' ')}.</span>
      <span class="track-fname">${t ? t.filename : id}</span>
      <span class="track-dur">${t?.durationSeconds ? fmtDur(t.durationSeconds) : ''}</span>
    </li>`;
  }).join('');
}

// ── State polling ────────────────────────────────────────────────────────────
async function poll() {
  const [state, playlists] = await Promise.all([
    api('GET', '/api/playback'),
    api('GET', '/api/playlists')
  ]);

  if (!state) {
    document.getElementById('poll-status').textContent = 'Server unreachable';
    return;
  }

  document.getElementById('poll-status').textContent = 'Live';

  // ── Lifecycle boundary detection ─────────────────────────────────────────
  if (lastState) {
    const trackChanged    = state.currentTrackId !== lastState.currentTrackId && state.currentTrackId != null;
    const playlistChanged = state.activePlaylistId !== lastState.activePlaylistId;
    const modeChanged     = state.playbackMode !== lastState.playbackMode;

    if      (trackChanged)   lifecycle.startNew('track-changed');
    else if (playlistChanged) lifecycle.startNew('playlist-switched');
    else if (modeChanged)     lifecycle.startNew('mode-changed');
  }

  lastState = state;
  syncAudio(state);
  render(state, playlists);
}

// ── Command buttons ──────────────────────────────────────────────────────────
async function cmd(method, path) {
  uiLog.debug(`Command issued: ${method} ${path}`);
  await api(method, path);
  await poll();
}

document.getElementById('btn-play').addEventListener('click', async () => {
  const replayAfterStop = audioEl.paused && audioEl.currentTime <= 0.05 && lastState?.currentTrackId;
  if (replayAfterStop) {
    lifecycle.startNew('same-track-replay-after-stop');
  }

  localPlayRequested = true;
  if (!lastState?.currentTrackId) {
    await cmd('POST', '/api/playback/play');
  }

  audioEl.play().catch(err =>
    audioLog.error('audio.play() rejected', { error: err.message }));
  renderTransportStatus();
});

document.getElementById('btn-pause').addEventListener('click', async () => {
  audioEl.pause();
  localPlayRequested = false;
  if (lastState?.currentTrackId) {
    await cmd('POST', `/api/playback/seek?positionSeconds=${Math.floor(audioEl.currentTime || 0)}`);
  }
  renderTransportStatus();
});

document.getElementById('btn-stop').addEventListener('click', async () => {
  audioEl.pause();
  audioEl.currentTime = 0;
  localPlayRequested = false;
  pendingSeekTargetSeconds = 0;
  if (lastState?.currentTrackId) {
    await cmd('POST', '/api/playback/stop');
  } else {
    renderTransportStatus();
    updatePositionFromAudio();
  }
});

document.getElementById('btn-next').addEventListener('click', async () => {
  const shouldResume = !audioEl.paused;
  localPlayRequested = shouldResume;
  await cmd('POST', '/api/playback/next');
  if (shouldResume) {
    audioEl.play().catch(err =>
      audioLog.error('audio.play() rejected after next track', { error: err.message }));
  }
});

const seekSliderEl = document.getElementById('seek-slider');
seekSliderEl.addEventListener('input', () => {
  isSeekSliderActive = true;
  document.getElementById('seek-preview').textContent = fmtDur(Number(seekSliderEl.value));
});
seekSliderEl.addEventListener('change', async () => {
  isSeekSliderActive = false;
  const targetSeconds = Math.floor(Number(seekSliderEl.value));
  pendingSeekTargetSeconds = targetSeconds;

  // Apply immediate local seek so UI interaction is responsive while server state catches up.
  if (Number.isFinite(audioEl.duration) || currentAudioTrackId != null) {
    audioEl.currentTime = targetSeconds;
  }

  await cmd('POST', `/api/playback/seek?positionSeconds=${targetSeconds}`);
});

audioEl.addEventListener('timeupdate', updatePositionFromAudio);
audioEl.addEventListener('play', renderTransportStatus);
audioEl.addEventListener('pause', renderTransportStatus);

document.getElementById('btn-sequential').addEventListener('click', () => {
  lifecycle.startNew('mode-change-requested');
  cmd('POST', '/api/playback/mode/sequential');
});
document.getElementById('btn-random').addEventListener('click', () => {
  lifecycle.startNew('mode-change-requested');
  cmd('POST', '/api/playback/mode/random');
});

document.getElementById('playlist-list').addEventListener('click', e => {
  const li = e.target.closest('li[data-id]');
  if (!li) return;
  lifecycle.startNew('playlist-selection-requested');
  uiLog.info(`Selecting playlist: ${li.dataset.id}`);
  api('POST', `/api/playlists/${li.dataset.id}/select`).then(poll);
});

// ── Bootstrap ────────────────────────────────────────────────────────────────
appLog.info('Gravifon SPA starting');

api('GET', '/api/tracks').then(tracks => {
  if (tracks) {
    trackCatalog = Object.fromEntries(tracks.map(t => [t.id, t]));
    appLog.info(`Catalog loaded: ${tracks.length} tracks`);
  }
  poll();
  setInterval(poll, 2000);
});
</script>
</body>
</html>
